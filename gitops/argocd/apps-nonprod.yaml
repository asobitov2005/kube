apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: web-services-nonprod
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - service: dotnet-api
                - service: python-api
                - service: node-api
                - service: go-api
                - service: java-api
                - service: php-api
                - service: ruby-api
                - service: rust-api
                - service: nginx-web
                - service: caddy-web
                - service: busybox-web
          - list:
              elements:
                - environment: dev
                  namespace: demo-dev
                - environment: stage
                  namespace: demo-stage
  template:
    metadata:
      name: '{{service}}-{{environment}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/asobitov2005/kube.git
        targetRevision: main
        path: charts/web-service
        helm:
          valueFiles:
            - ../../apps/{{service}}/values.yaml
            - ../../environments/{{environment}}/common.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
