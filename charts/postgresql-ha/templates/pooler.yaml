{{- if .Values.pooler.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.pooler.name }}
spec:
  cluster:
    name: {{ .Values.clusterName }}
  instances: {{ .Values.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: {{ .Values.pooler.poolMode }}
    parameters:
      max_client_conn: {{ .Values.pooler.maxClientConnections | quote }}
      default_pool_size: {{ .Values.pooler.defaultPoolSize | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          resources:
            {{- toYaml .Values.pooler.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: pgbouncer
                topologyKey: kubernetes.io/hostname
{{- end }}

