replicaCount: 2

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

containerPort: 8080

service:
  type: ClusterIP
  port: 80

env: {}
secretEnv: []
# - name: DB_PASSWORD
#   secretName: app-db-credentials
#   key: password

config: {}
envFromSecrets: []

# DB ishlatadigan servis faqat `database.enabled: true` deydi. Host namespace'dan
# avtomatik quriladi; kerak bo'lsa `host` bilan almashtirish mumkin.
database:
  enabled: false
  host: ""
  serviceName: postgres-pooler-rw
  port: "5432"
  name: app
  credentialsSecret: app-db-credentials
  usernameKey: username
  passwordKey: password

probes:
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  # Host avtomatik: <release-nomi>.<domain>
  domain: local
  annotations: {}
  hosts: []
  tls: []

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}

nodeSelector: {}
tolerations: []
affinity: {}
