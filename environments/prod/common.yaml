replicaCount: 3
image:
  tag: local
  pullPolicy: IfNotPresent
podDisruptionBudget:
  enabled: true
  minAvailable: 2
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: true
  domain: example.com
topologySpread:
  enabled: true
  whenUnsatisfiable: DoNotSchedule
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
