replicaCount: 1
image:
  tag: local
  pullPolicy: IfNotPresent
podDisruptionBudget:
  enabled: false
autoscaling:
  enabled: false
ingress:
  enabled: false
  domain: dev.local
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 150m
    memory: 128Mi
