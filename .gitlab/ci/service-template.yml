.service-build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/kube-$SERVICE:$CI_COMMIT_SHA" "apps/$SERVICE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$CI_REGISTRY_IMAGE/kube-$SERVICE:$CI_COMMIT_SHA"
      fi

